name: CI

on:
  push:
    branches:
      - '8.0'
  pull_request:
    branches:
      - '8.0'

env:
  APP_ENV: test

jobs:
  symfony:
    name: Symfony 8.0 (PHP ${{ matrix.php-versions }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php-versions: ['8.4', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP != 8.5 with extensions and Composer v2
        if: ${{ matrix.php-versions != '8.5' }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          tools: composer:v2
          extensions: ctype, iconv, intl, json, mbstring, pdo, pdo_sqlite
        env:
          update: true

      - name: Setup PHP 8.5 with extensions and Composer v2
        if: ${{ matrix.php-versions == '8.5' }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          tools: composer:v2
          extensions: ctype, iconv, intl, json, mbstring, pdo, pdo_sqlite
          # this ini directive seems to be off by default in PHP 8.5
          # see https://github.com/php/php-src/issues/20279
          # enable it because codeception relies on it.
          ini-values: register_argc_argv=1
        env:
          update: true

      - name: Validate composer.json
        run: composer validate

      - name: Get composer cache directory
        id: composer-cache
        run: echo "::set-output name=dir::$(composer config cache-files-dir)"

      - name: Cache composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-${{ matrix.php-versions }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-${{ matrix.php-versions }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-progress

      - name: Update database schema
        run: php bin/console doctrine:schema:update --force

      - name: Load Doctrine fixtures
        run: php bin/console doctrine:fixtures:load --quiet

      - name: Run functional tests
        run: vendor/bin/codecept run Functional
